services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rental}
      POSTGRES_USER: ${POSTGRES_USER:-rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rental}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rental} -d ${POSTGRES_DB:-rental}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: thescorpoi/backend:v3
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "cd backend && alembic upgrade head && cd .. && python -m backend.app.utils.seed && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: thescorpoi/frontend:v1
    depends_on:
      - backend
    command: npm start -- --host 0.0.0.0 --port 4200
    ports:
      - "4002:4200"

  pgadmin:
    image: dpage/pgadmin4:latest
    env_file: .env
    environment:
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    depends_on:
      - postgres
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgres-dev-data:
  pgadmin-data:
